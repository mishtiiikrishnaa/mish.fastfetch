name: release
# push a tag that is EXACTLY the manifest version (no leading "v"), e.g.  git tag 1.0.0 && git push origin 1.0.0
# the workflow checks the repo, then makes a DRAFT release with the three files obsidian needs.
# open the draft on github, read it once, and press publish.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run the repo checks
        run: bash scripts/check.sh
      - name: create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --draft --title "$GITHUB_REF_NAME" --generate-notes
